components:
  schemas:
    AccessLevelEnum:
      enum:
      - view
      - record
      - manage
      type: string
      description: |-
        * `view` - view
        * `record` - record
        * `manage` - manage
    AnchorEnum:
      enum:
      - sowing
      - stage_start
      - stage_end
      - previous_item
      type: string
      description: |-
        * `sowing` - sowing
        * `stage_start` - stage start
        * `stage_end` - stage end
        * `previous_item` - previous item
    AreaSourceEnum:
      enum:
      - entered
      - drawn
      type: string
      description: |-
        * `entered` - entered
        * `drawn` - drawn
    Asset:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        version:
          type: integer
          readOnly: true
        asset_class:
          $ref: '#/components/schemas/AssetClassEnum'
        name:
          type: string
        code:
          type: string
        description:
          type: string
        status:
          allOf:
          - $ref: '#/components/schemas/AssetStatusEnum'
          readOnly: true
        acquired_on:
          type: string
          format: date
          nullable: true
        retired_on:
          type: string
          format: date
          nullable: true
        attributes: {}
        created_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        updated_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        farm:
          type: string
          format: uuid
          readOnly: true
        home_location:
          type: string
          format: uuid
          nullable: true
      required:
      - created_at
      - created_by
      - farm
      - id
      - status
      - updated_at
      - updated_by
      - version
    AssetCapitalProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        version:
          type: integer
          readOnly: true
        in_service_date:
          type: string
          format: date
        acquisition_cost:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        capital_additions_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
        salvage_value:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        expected_life_hours:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,4})?$
        expected_life_years:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,4})?$
        notes:
          type: string
        created_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        updated_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        farm:
          type: string
          format: uuid
          readOnly: true
        asset:
          type: string
          format: uuid
      required:
      - asset
      - capital_additions_total
      - created_at
      - created_by
      - farm
      - id
      - in_service_date
      - updated_at
      - updated_by
      - version
